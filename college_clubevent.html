<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Campus Club Events</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6fb;--surf:#fff;--ink:#121a3a;--mute:#5a6383;--line:#dde1ee;--brand:#4b3fe0;--brand-ink:#fff;--pop:#19c9a0;--dark:#121a3a;--dark-ink:#f4f6fb;--bad:#c62f4b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1226;--surf:#161d3a;--ink:#eef0fa;--mute:#9aa3c7;--line:#2a3360;--brand:#8b80ff;--brand-ink:#0d1226;--dark:#1d2650;--dark-ink:#eef0fa;--bad:#ff7b93}}
:root[data-theme="dark"]{--bg:#0d1226;--surf:#161d3a;--ink:#eef0fa;--mute:#9aa3c7;--line:#2a3360;--brand:#8b80ff;--brand-ink:#0d1226;--dark:#1d2650;--dark-ink:#eef0fa;--bad:#ff7b93}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 "DM Sans",system-ui,sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque","DM Sans",system-ui,sans-serif;line-height:1.1;margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--pop);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
header.top{background:var(--surf);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:12px;padding-bottom:12px}
.logo{font:800 20px "Bricolage Grotesque",sans-serif;text-decoration:none}
.logo i{font-style:normal;color:var(--brand)}
nav{display:flex;gap:4px}
nav a{padding:8px 14px;border-radius:999px;text-decoration:none;font-weight:500}
nav a.on{background:var(--brand);color:var(--brand-ink)}
main{padding:32px 0 64px;min-height:70vh}
.hero{padding:24px 0 36px}
.hero h1{font-size:clamp(38px,8vw,76px);font-weight:800;letter-spacing:-.03em;max-width:13ch}
.hero p{font-size:18px;color:var(--mute);max-width:54ch;margin:18px 0 24px}
.btn{font:700 15px "DM Sans",sans-serif;border:0;border-radius:10px;padding:11px 18px;background:var(--brand);color:var(--brand-ink);cursor:pointer;text-decoration:none;display:inline-block}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.sm{padding:7px 12px;font-size:14px}
.btn.bad{background:var(--bad);color:#fff}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.feat{background:var(--dark);color:var(--dark-ink);border-radius:20px;padding:28px;display:grid;gap:20px;grid-template-columns:1fr;margin-bottom:40px}
.feat h2{font-size:clamp(28px,5vw,44px)}
.feat .meta{color:#b9c0e6;margin:10px 0 14px}
.feat .tag{background:var(--pop);color:#062b22}
.feat .btn{background:var(--pop);color:#062b22}
.tag{display:inline-block;background:color-mix(in srgb,var(--brand) 16%,transparent);color:var(--brand);border-radius:6px;padding:2px 9px;font-size:13px;font-weight:700}
.sec-h{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:0 0 16px}
.sec-h h2{font-size:28px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.card{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px}
.card h3{font-size:21px}
.card p{margin:0;color:var(--mute);flex:1}
.when{font-weight:700}
.meta{font-size:14px}
.card .meta{color:var(--mute)}
.card.past{opacity:.65}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 20px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surf);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.bar input{flex:2 1 220px;width:auto}.bar select{flex:1 1 160px;width:auto}
label{display:block;font-weight:700;font-size:14px;margin:0 0 4px}
.f{margin-bottom:12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
dialog{border:0;border-radius:16px;padding:0;width:min(520px,calc(100vw - 24px));background:var(--surf);color:var(--ink)}
dialog::backdrop{background:rgba(10,14,35,.6)}
dialog form,dialog .box{padding:22px}
dialog h2{font-size:26px;margin-bottom:4px}
.acts{display:flex;gap:10px;justify-content:flex-end;margin-top:8px}
.err{color:var(--bad);font-size:14px;margin:0 0 10px;min-height:1em}
.empty{padding:40px 16px;text-align:center;color:var(--mute);border:1.5px dashed var(--line);border-radius:14px}
.tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.tw{overflow-x:auto;background:var(--surf);border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
th{color:var(--mute);font-weight:700}
tr:last-child td{border-bottom:0}
td .btn{margin-right:6px}
.stat{color:var(--mute);margin:0 0 10px}
.login{max-width:380px;margin:40px auto}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--dark);color:var(--dark-ink);padding:12px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:90vw}
#toast.show{opacity:1}
footer{border-top:1px solid var(--line);padding:20px 0;color:var(--mute);font-size:14px}
@media (min-width:760px){.feat{grid-template-columns:1.6fr 1fr;align-items:center;padding:36px}}
@media (max-width:480px){.row2{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="logo" href="#/">Campus<i>Clubs</i></a>
  <nav aria-label="Main"><a href="#/" data-n="home">Home</a><a href="#/events" data-n="events">Events</a><a href="#/admin" data-n="admin">Admin</a></nav>
</div></header>
<main><div class="wrap" id="app"></div></main>
<footer><div class="wrap">Campus Clubs events board. Register for an event and the organisers will confirm by email.</div></footer>
<dialog id="dlg"></dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script>
const PASS='admin123', CATS=['Technical','Cultural','Sports','Workshop','Social'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mem={};
const ld=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):(mem[k]??d)}catch(e){return mem[k]??d}};
const sv=(k,v)=>{mem[k]=v;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const dt=n=>{const x=new Date();x.setDate(x.getDate()+n);x.setHours(17,0,0,0);const p=v=>String(v).padStart(2,'0');return `${x.getFullYear()}-${p(x.getMonth()+1)}-${p(x.getDate())}T${p(x.getHours())}:00`};
let events=ld('ce_events',null);
if(!events){events=[
 {id:'e1',name:'Hack the Campus 24h',category:'Technical',date:dt(9),venue:'Innovation Lab, Block C',description:'A 24-hour build sprint. Form teams of up to four and ship a working prototype.',featured:true},
 {id:'e2',name:'Intro to Web Development',category:'Workshop',date:dt(3),venue:'Seminar Hall 2',description:'Hands-on HTML and CSS session for beginners. Bring a laptop.',featured:false},
 {id:'e3',name:'Open Mic Night',category:'Cultural',date:dt(5),venue:'Amphitheatre',description:'Music, poetry, stand-up. Perform or cheer from the steps.',featured:false},
 {id:'e4',name:'Inter-Year Football Cup',category:'Sports',date:dt(14),venue:'Main Ground',description:'Knockout tournament between first, second and third year squads.',featured:false},
 {id:'e5',name:'Freshers Meet & Greet',category:'Social',date:dt(7),venue:'Student Centre',description:'Meet club leads, pick your clubs and eat free snacks.',featured:false},
 {id:'e6',name:'Git and GitHub Basics',category:'Workshop',date:dt(-10),venue:'Seminar Hall 1',description:'Version control from scratch. This session has ended.',featured:false}];sv('ce_events',events)}
let regs=ld('ce_regs',[]);
let authed=false,tab='events';
const now=()=>new Date();
const up=e=>new Date(e.date)>=now();
const fmt=d=>new Date(d).toLocaleString('en-IN',{weekday:'short',day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});
const byDate=(a,b)=>new Date(a.date)-new Date(b.date);
const $=s=>document.querySelector(s);
const app=$('#app'),dlg=$('#dlg');
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2800)}
function openDlg(h){dlg.innerHTML=h;if(!dlg.open)dlg.showModal()}

function card(e){const past=!up(e);return `<article class="card ${past?'past':''}"><div><span class="tag">${esc(e.category)}</span></div><h3>${esc(e.name)}</h3><div class="when">${fmt(e.date)}</div><div class="meta">Venue: ${esc(e.venue)}</div><p>${esc(e.description)}</p><button class="btn" data-reg="${e.id}" ${past?'disabled':''}>${past?'Event ended':'Register'}</button></article>`}

function home(){
  const u=events.filter(up).sort(byDate);
  const f=u.find(e=>e.featured)||u[0];
  const rest=u.filter(e=>!f||e.id!==f.id).slice(0,3);
  return `<section class="hero"><h1>See what your clubs are planning.</h1><p>We are a student-run community of builders, performers and players. Browse upcoming events, pick what fits your week and register in under a minute.</p><a class="btn" href="#/events">Browse all events</a></section>
  ${f?`<section class="feat" aria-label="Featured event"><div><span class="tag">Featured: ${esc(f.category)}</span><h2 style="margin-top:12px">${esc(f.name)}</h2><div class="meta">${fmt(f.date)} &middot; ${esc(f.venue)}</div><p style="margin:0">${esc(f.description)}</p></div><div><button class="btn" data-reg="${f.id}">Register for this event</button></div></section>`:''}
  <div class="sec-h"><h2>Upcoming events</h2><a href="#/events">View all</a></div>
  ${rest.length?`<div class="grid">${rest.map(card).join('')}</div>`:'<div class="empty">No upcoming events yet. Check back soon.</div>'}`}

function eventsPage(){return `<div class="sec-h"><h2>All events</h2></div>
  <div class="bar"><input id="q" type="search" placeholder="Search events by name" aria-label="Search events by name"><select id="cat" aria-label="Filter by category"><option value="">All categories</option>${CATS.map(c=>`<option>${c}</option>`).join('')}</select></div><div id="list"></div>`}
function drawList(){const q=($('#q').value||'').toLowerCase().trim(),c=$('#cat').value;
  const l=events.filter(e=>e.name.toLowerCase().includes(q)&&(!c||e.category===c)).sort(byDate);
  $('#list').innerHTML=l.length?`<div class="grid">${l.map(card).join('')}</div>`:'<div class="empty">No events match your search. Clear the filters to see everything.</div>'}

function regForm(id){const e=events.find(x=>x.id===id);if(!e)return;
  openDlg(`<form id="regf" data-id="${id}" novalidate><h2>Register</h2><p class="meta" style="color:var(--mute);margin:0 0 14px">${esc(e.name)}, ${fmt(e.date)}</p>
  <div class="f"><label for="rn">Full name</label><input id="rn" name="name" autocomplete="name" required></div>
  <div class="f"><label for="re">Email</label><input id="re" name="email" type="email" autocomplete="email" required></div>
  <div class="f"><label for="rc">College and year</label><input id="rc" name="college" placeholder="e.g. ABES Engineering College, 1st year" required></div>
  <div class="f"><label for="rp">Phone number</label><input id="rp" name="phone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="10-digit mobile number" required></div>
  <p class="err" id="rerr" role="alert"></p><div class="acts"><button type="button" class="btn ghost" data-close>Cancel</button><button class="btn">Submit registration</button></div></form>`)}

function submitReg(f){const v=Object.fromEntries(new FormData(f)),id=f.dataset.id,er=$('#rerr');
  v.name=v.name.trim();v.email=v.email.trim();v.college=v.college.trim();v.phone=v.phone.replace(/[\s-]/g,'');
  if(!v.name||!v.college)return er.textContent='Enter your name and your college and year.';
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v.email))return er.textContent='Enter a valid email address.';
  if(!/^(\+91)?\d{10}$/.test(v.phone))return er.textContent='Enter a 10-digit phone number.';
  if(regs.some(r=>r.eventId===id&&r.email.toLowerCase()===v.email.toLowerCase()))return er.textContent='This email is already registered for the event.';
  regs.push({id:'r'+Date.now(),eventId:id,...v,at:new Date().toISOString()});sv('ce_regs',regs);dlg.close();toast('Registered. See you there!')}

/* admin */
function admin(){
  if(!authed)return `<form class="card login" id="loginf"><h2>Admin sign in</h2><div class="f"><label for="pw">Passcode</label><input id="pw" type="password" autocomplete="current-password"></div><p class="err" id="lerr" role="alert"></p><button class="btn">Sign in</button><p class="meta" style="margin:0;color:var(--mute)">Demo passcode: admin123</p></form>`;
  return `<div class="sec-h"><h2>Admin dashboard</h2><button class="btn ghost sm" data-logout>Sign out</button></div>
  <div class="tabs"><button class="btn ${tab==='events'?'':'ghost'}" data-tab="events">Events (${events.length})</button><button class="btn ${tab==='regs'?'':'ghost'}" data-tab="regs">Registrations (${regs.length})</button></div>
  ${tab==='events'?adminEvents():adminRegs()}`}
function adminEvents(){const l=[...events].sort(byDate);
  return `<div class="sec-h"><p class="stat">Manage what students see on the site.</p><button class="btn" data-edit="">Add event</button></div>
  ${l.length?`<div class="tw"><table><thead><tr><th>Event</th><th>Date</th><th>Venue</th><th>Registered</th><th>Actions</th></tr></thead><tbody>${l.map(e=>`<tr><td><b>${esc(e.name)}</b><br><span class="tag">${esc(e.category)}</span>${e.featured?' <span class="tag">Featured</span>':''}</td><td>${fmt(e.date)}</td><td>${esc(e.venue)}</td><td>${regs.filter(r=>r.eventId===e.id).length}</td><td><button class="btn ghost sm" data-edit="${e.id}">Edit</button><button class="btn bad sm" data-del="${e.id}">Delete</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No events. Add your first event.</div>'}`}
function adminRegs(){return `<div class="bar"><input id="rq" type="search" placeholder="Search by name, email or college" aria-label="Search registrations"><select id="rev" aria-label="Filter by event"><option value="">All events</option>${events.map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('')}</select></div><p class="stat" id="rcount"></p><div id="rlist"></div>`}
function drawRegs(){const q=$('#rq').value.toLowerCase().trim(),ev=$('#rev').value;
  const l=regs.filter(r=>(!ev||r.eventId===ev)&&(`${r.name} ${r.email} ${r.college}`.toLowerCase().includes(q)));
  $('#rcount').textContent=`${l.length} of ${regs.length} registrations`;
  $('#rlist').innerHTML=l.length?`<div class="tw"><table><thead><tr><th>Name</th><th>Email</th><th>College / Year</th><th>Phone</th><th>Event</th></tr></thead><tbody>${l.map(r=>{const e=events.find(x=>x.id===r.eventId);return `<tr><td>${esc(r.name)}</td><td>${esc(r.email)}</td><td>${esc(r.college)}</td><td>${esc(r.phone)}</td><td>${esc(e?e.name:'Deleted event')}</td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">No registrations match. Change the search or event filter.</div>'}
function evForm(id){const e=events.find(x=>x.id===id)||{name:'',category:CATS[0],date:dt(7),venue:'',description:'',featured:false};
  openDlg(`<form id="evf" data-id="${id||''}"><h2>${id?'Edit event':'Add event'}</h2>
  <div class="f"><label for="en">Event name</label><input id="en" name="name" value="${esc(e.name)}" required></div>
  <div class="row2"><div class="f"><label for="ec">Category</label><select id="ec" name="category">${CATS.map(c=>`<option ${c===e.category?'selected':''}>${c}</option>`).join('')}</select></div>
  <div class="f"><label for="ed">Date and time</label><input id="ed" name="date" type="datetime-local" value="${esc(e.date)}" required></div></div>
  <div class="f"><label for="ev">Venue</label><input id="ev" name="venue" value="${esc(e.venue)}" required></div>
  <div class="f"><label for="eds">Description</label><textarea id="eds" name="description" rows="3" required>${esc(e.description)}</textarea></div>
  <label style="display:flex;gap:8px;align-items:center;font-weight:500"><input type="checkbox" name="featured" style="width:auto" ${e.featured?'checked':''}> Show as the featured event on the home page</label>
  <div class="acts"><button type="button" class="btn ghost" data-close>Cancel</button><button class="btn">Save event</button></div></form>`)}
function saveEv(f){const v=Object.fromEntries(new FormData(f)),id=f.dataset.id;v.featured=!!v.featured;
  if(v.featured)events.forEach(e=>e.featured=false);
  if(id){Object.assign(events.find(e=>e.id===id),v)}else events.push({id:'e'+Date.now(),...v});
  sv('ce_events',events);dlg.close();toast(id?'Event updated':'Event added');render()}
function delEv(id){const e=events.find(x=>x.id===id),n=regs.filter(r=>r.eventId===id).length;
  openDlg(`<div class="box"><h2>Delete event?</h2><p>"${esc(e.name)}" will be removed${n?` along with its ${n} registration${n>1?'s':''}`:''}. This cannot be undone.</p><div class="acts"><button class="btn ghost" data-close>Cancel</button><button class="btn bad" data-confirm="${id}">Delete event</button></div></div>`)}

function render(){
  const h=location.hash||'#/',p=h.startsWith('#/events')?'events':h.startsWith('#/admin')?'admin':'home';
  document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.n===p));
  app.innerHTML=p==='home'?home():p==='events'?eventsPage():admin();
  if(p==='events')drawList();if(p==='admin'&&authed&&tab==='regs')drawRegs();
  window.scrollTo(0,0)}
addEventListener('hashchange',render);
document.addEventListener('click',ev=>{const t=ev.target.closest('[data-reg],[data-close],[data-tab],[data-edit],[data-del],[data-confirm],[data-logout]');if(!t)return;
  const d=t.dataset;
  if('reg' in d)regForm(d.reg);
  else if('close' in d)dlg.close();
  else if('tab' in d){tab=d.tab;render()}
  else if('edit' in d)evForm(d.edit);
  else if('del' in d)delEv(d.del);
  else if('confirm' in d){events=events.filter(e=>e.id!==d.confirm);regs=regs.filter(r=>r.eventId!==d.confirm);sv('ce_events',events);sv('ce_regs',regs);dlg.close();toast('Event deleted');render()}
  else if('logout' in d){authed=false;render()}});
document.addEventListener('submit',ev=>{const f=ev.target;ev.preventDefault();
  if(f.id==='regf')submitReg(f);
  else if(f.id==='evf')saveEv(f);
  else if(f.id==='loginf'){if($('#pw').value===PASS){authed=true;render()}else $('#lerr').textContent='Incorrect passcode. Try again.'}});
document.addEventListener('input',ev=>{const i=ev.target.id;if(i==='q'||i==='cat')drawList();if(i==='rq'||i==='rev')drawRegs()});
render();
</script>
</body>
</html>
